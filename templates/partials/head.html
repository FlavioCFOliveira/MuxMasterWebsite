{{define "head"}}<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.FullTitle}}</title>
  <meta name="description" content="{{.Description}}">
  {{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">{{end}}
  {{if .HasMarkdown}}<link rel="alternate" type="text/markdown" href="{{if .MarkdownAlternateURL}}{{.MarkdownAlternateURL}}{{else}}{{.Canonical}}.md{{end}}">{{end}}
  {{if .Robots}}<meta name="robots" content="{{.Robots}}">{{end}}

  {{if .Canonical}}
  <meta property="og:type" content="{{.OGType}}">
  <meta property="og:title" content="{{.FullTitle}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:url" content="{{.Canonical}}">
  <meta property="og:image" content="{{.OGImage}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MuxMaster — high-performance HTTP router for Go">
  <meta property="og:site_name" content="MuxMaster">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{.FullTitle}}">
  <meta name="twitter:description" content="{{.Description}}">
  <meta name="twitter:image" content="{{.OGImage}}">
  <meta name="twitter:image:alt" content="MuxMaster — high-performance HTTP router for Go">
  {{end}}

  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon-180.png">

  <link rel="stylesheet" href="{{.CSSPath}}">

  {{range .JSONLD}}
  {{jsonldblock .}}
  {{end}}
</head>
{{end}}
