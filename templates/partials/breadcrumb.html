{{define "breadcrumb"}}{{if .}}{{$last := lastIndex .}}<nav aria-label="Breadcrumb" class="mb-6 text-sm text-zinc-600 dark:text-zinc-400">
  <ol class="flex flex-wrap items-center gap-1">
    {{range $i, $c := .}}
      {{if $i}}<li aria-hidden="true" class="px-1 text-zinc-400">/</li>{{end}}
      <li>
        {{if eq $i $last}}<span aria-current="page">{{$c.Label}}</span>{{else if $c.Href}}<a href="{{$c.Href}}" class="inline-flex items-center min-h-11 hover:underline">{{$c.Label}}</a>{{else}}<span>{{$c.Label}}</span>{{end}}
      </li>
    {{end}}
  </ol>
</nav>{{end}}{{end}}
