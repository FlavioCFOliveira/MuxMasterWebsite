# CI pipeline — see specification/ci.md for the contract.
#
# Required steps (every pull request):
#   1. Setup
#   2. Vet & test (the structured-data validation gate runs here as
#      `go test`; failures of TestJSONLDValidationGate or any other test
#      block merge per spec/ci.md § Required steps).
#   3. Build
#   4. Upload test output as a build artefact (the validator's per-page
#      defects, when present, land in the test log; reviewers download
#      the artefact from the PR).
#
# Out of scope today: nu-validator. Lighthouse and pa11y now run as
# a warning-only job (rmp #81). The job is allowed to fail without
# blocking merge; once a green week is on record the warning posture
# flips to blocking.
#
# The image-build step (rmp #75) ensures Dockerfile regressions
# (broken Tailwind step, missing assets, multi-stage path drift) are
# caught at PR time rather than at deploy time.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: test + structured-data validation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The renderer requires a hashed CSS bundle at static/css/app.<hash>.css
      # (produced by Tailwind v4 standalone via `make css`); server tests
      # instantiate the renderer at New() and fail hard when the bundle is
      # missing. Build it before the tests run.
      - name: Build CSS bundle
        run: make css

      # The structured-data validation gate (spec/ci.md § Validation)
      # runs as part of `go test`. TestJSONLDValidationGate exercises
      # every prerendered HTML page through both the schema.org
      # structural checks (task #50) and the rich-result eligibility
      # checks (task #51). Failure here blocks merge.
      - name: go test (includes JSON-LD validation gate)
        run: go test -race -v ./... | tee test-output.log
        shell: bash

      - name: go build
        run: go build ./...

      # Build the production container so any Dockerfile regression is
      # caught at PR time (rmp #75). The image is not pushed anywhere;
      # build-only, no registry write permission. Buildx is used for
      # the layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: muxmaster-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Upload the full test log as a build artefact so reviewers can
      # audit the per-page validator output even on a green PR (warnings
      # and intentional omissions are recorded in the audit-trail HTML
      # comments above each <script> tag and surface in the test log
      # whenever a page is logged at -v).
      - name: Upload test output artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsonld-validation-output
          path: test-output.log
          retention-days: 30

  lighthouse-and-pa11y:
    name: Lighthouse + pa11y (warning-only — rmp #81)
    runs-on: ubuntu-latest
    needs: test-and-validate
    # Warning-only for now: Lighthouse / pa11y scores are reported but
    # the job is allowed to fail without blocking merge. Once a green
    # week is on record the `continue-on-error: true` lines come off
    # and the gate becomes blocking (spec/ci.md § Out of scope).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node (for lhci + pa11y)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build site assets
        run: make css

      - name: Start server in background
        run: |
          go run ./cmd/muxmaster-website &
          echo $! > /tmp/srv.pid
          # Wait up to 30s for the listener to come up — the prerender
          # pass blocks until every public route is materialised.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        continue-on-error: true
        run: |
          npm install -g @lhci/cli@0.14
          lhci autorun --config=.lighthouserc.json || true

      - name: Run pa11y
        continue-on-error: true
        run: |
          npm install -g pa11y-ci@3
          pa11y-ci --config .pa11yci.json || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/srv.pid ]; then
            kill "$(cat /tmp/srv.pid)" || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
          if-no-files-found: ignore
