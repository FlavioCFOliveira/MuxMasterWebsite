{{define "header"}}<header class="border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900">
  <div class="mx-auto flex w-full max-w-5xl items-center gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <a href="/" class="flex items-center gap-2 font-semibold" aria-label="MuxMaster home">
      <span class="text-lg">MuxMaster</span>
    </a>
    <nav aria-label="Primary" class="ml-auto flex items-center gap-4 text-sm">
      <a href="/docs/" class="hover:underline">Docs</a>
      <a href="/api" class="hover:underline">API</a>
      <a href="/examples/" class="hover:underline">Examples</a>
      <a href="/benchmarks" class="hover:underline">Benchmarks</a>
      <a href="https://github.com/FlavioCFOliveira/MuxMaster" rel="noopener" target="_blank" class="hover:underline">GitHub<span class="sr-only"> (opens in a new tab)</span></a>
      <span class="rounded bg-yellow-200 px-2 py-0.5 text-xs font-mono text-zinc-900" aria-label="MuxMaster version">{{.Version}}</span>
      <label for="dark-toggle" class="cursor-pointer rounded border border-zinc-300 px-2 py-1 text-xs dark:border-zinc-700" aria-label="Toggle dark mode">Theme</label>
    </nav>
  </div>
</header>
{{end}}
